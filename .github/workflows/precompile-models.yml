name: precompile-models

# Build & publish precompiled Stan model binaries for the toolchain-free download
# fallback.
#
# Triggers on a published GitHub Release (the normal path: tag a release, this
# builds + attaches assets automatically) and on workflow_dispatch for manual
# rebuilds/testing. The workflow itself is safe to have in the repo at any time --
# it only takes real action (uploading release assets) when it actually runs.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        # Required: the manifest job publishes release assets to this tag, and the
        # download-test job fetches from it (via BVARNET_MODELS_TAG). An empty tag
        # would make the release step fall back to a branch ref and fail.
        description: 'Existing tag to build for and attach assets to (e.g. citest-<sha> or v1.0.1).'
        required: true
        type: string

permissions:
  contents: write   # required to upload assets to a release (softprops/action-gh-release)

env:
  # Pinned CmdStan version for every platform in this build.
  CMDSTAN_VERSION: "2.39.0"

jobs:
  # ---------------------------------------------------------------------------
  # BUILD: install CmdStan, install bvarnet from source (which compiles the
  # three models via src/install.libs.R -> instantiate::stan_package_compile(),
  # the exact same path a real from-source user goes through), then assemble
  # the platform asset (models + .stan + runtime stub + bundled TBB + SHA256SUMS).
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.config.platform }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: macos-14,        platform: macos-arm64 }
          # macos-13 (Intel) was fully deprecated/removed by GitHub; macos-14/15/26 and
          # macos-latest are Apple Silicon (arm64) only now -- Intel x86_64 macOS runners
          # are a separate label. Verified 2026-07-02.
          - { os: macos-15-intel,  platform: macos-x86_64 }
          # ubuntu-20.04 was fully deprecated/removed by GitHub; ubuntu-22.04 is the oldest
          # still-supported image, which RAISES the glibc floor from 2.31 to ~2.35 versus the
          # OQ3 rationale in dev/precompiled_model_download_plan.md. Still comfortably covers
          # the target audience (Posit Cloud/Colab/Binder); revisit if that changes.
          - { os: ubuntu-22.04,    platform: linux-x86_64 }
          - { os: windows-latest,  platform: windows-x86_64 }
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: 'https://mc-stan.org/r-packages/'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::cmdstanr, any::digest, any::jsonlite
          needs: install

      - name: Cache CmdStan
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: ${{ runner.os }}-${{ matrix.config.platform }}-cmdstan-${{ env.CMDSTAN_VERSION }}

      - name: Install CmdStan (pinned version)
        shell: Rscript {0}
        run: |
          # check_cmdstan_toolchain()/install_cmdstan()'s built-in `check_toolchain`
          # pre-flight relies on a static R-version -> Rtools-version compatibility
          # table that can lag behind a newly released R (seen in practice: R 4.6.1
          # rejected as "Rtools44 not found" even though r-lib/actions/setup-r@v2
          # installs a matching Rtools automatically). CmdStan >= 2.35 needs no
          # special Windows toolchain configuration anyway (per cmdstanr's own docs),
          # so skip the table lookup and let the actual compile inside
          # install_cmdstan() be the real, authoritative test of the toolchain.
          # Skip entirely on an actions/cache hit (install_cmdstan warns-and-aborts
          # on an existing dir rather than reusing it cleanly).
          target <- path.expand(file.path("~", ".cmdstan",
                                          paste0("cmdstan-", Sys.getenv("CMDSTAN_VERSION"))))
          if (dir.exists(target)) {
            cat("CmdStan already present (cache hit):", target, "\n")
          } else {
            cmdstanr::install_cmdstan(version = Sys.getenv("CMDSTAN_VERSION"), cores = 2,
                                      quiet = TRUE, check_toolchain = FALSE)
          }

      # Static-link the MinGW C++ runtime so the model
      # exes carry no libstdc++-6/libgcc_s_seh-1/libwinpthread-1 dependency.
      # TBB stays dynamic (bundled instead, in assemble-model-asset.R).
      - name: Static-link the MinGW C++ runtime (Windows only)
        if: runner.os == 'Windows'
        shell: Rscript {0}
        run: |
          cmdstan_dir <- cmdstanr::cmdstan_path()
          make_local <- file.path(cmdstan_dir, "make", "local")
          # Idempotency marker: ~/.cmdstan is restored by actions/cache, so without
          # this guard the flags would be re-appended (duplicated) on every cached run.
          marker <- "# bvarnet-static-mingw"
          already <- file.exists(make_local) &&
            any(grepl(marker, readLines(make_local), fixed = TRUE))
          if (!already) cat(
            marker, "\n",
            "CXXFLAGS += -static-libgcc -static-libstdc++\n",
            # -Wl,-Bstatic is STATEFUL: it forces every -lNAME that follows on the
            # link line to resolve to a static archive, until -Wl,-Bdynamic reverts
            # it. Without the revert here, CmdStan's own later `-ltbb` (TBB is
            # deliberately kept dynamic and bundled separately -- see OQ8) also gets
            # forced into static-only lookup and fails with "cannot find -ltbb"
            # since no static TBB archive exists. Verified on real Windows CI.
            "LDFLAGS += -static-libgcc -static-libstdc++ -Wl,-Bstatic -lwinpthread -Wl,-Bdynamic\n",
            file = make_local, append = TRUE, sep = ""
          )
          cat("--- ", make_local, " ---\n", sep = "")
          cat(readLines(make_local), sep = "\n")

      # This is the SAME path a `install.packages(pkg, type = "source")` user
      # goes through: src/install.libs.R copies src/stan/ -> bin/stan/ and calls
      # instantiate::stan_package_compile(), which compiles all three models.
      - name: Install bvarnet from source (compiles the three Stan models)
        shell: Rscript {0}
        run: |
          install.packages(".", repos = NULL, type = "source", INSTALL_opts = "--no-multiarch")
          # install.packages() only WARNS on failure; assert hard so a compile/link
          # error fails THIS step, not the assemble step downstream.
          stopifnot(requireNamespace("bvarnet", quietly = TRUE))

      - name: Assemble platform asset
        shell: Rscript {0}
        run: |
          source(".github/scripts/assemble-model-asset.R")
          assemble_model_asset(
            platform        = "${{ matrix.config.platform }}",
            cmdstan_version = Sys.getenv("CMDSTAN_VERSION"),
            out_dir         = "asset-out"
          )

      - name: Assert MinGW C++ runtime is static-linked (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          Rscript .github/scripts/check-windows-static-link.R asset-out/staging/model_*.exe

      - name: Upload platform artifact (consumed by the manifest job)
        uses: actions/upload-artifact@v4
        with:
          name: model-asset-${{ matrix.config.platform }}
          path: |
            asset-out/*.tar.gz
            asset-out/asset-info.json
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # MANIFEST: aggregate every platform's asset-info.json into the per-version
  # manifest.json, asserting all platforms agree on source_hash/version/cmdstan_version,
  # then publish everything as release assets. Only runs to completion when triggered
  # by an actual release publish or an explicit workflow_dispatch with a real tag --
  # it does not create releases itself (never delete/mutate one either).
  # ---------------------------------------------------------------------------
  manifest:
    name: build manifest + publish release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Deliberately NOT r-lib/actions/setup-r-dependencies@v2 here. That action insists on
      # resolving the checked-out package's own DESCRIPTION dependency tree -- first via its
      # default `packages: "deps::."` (overridable), then AGAIN in its internal "Check if
      # package needs pandoc" step (`pak::pkg_deps(".")`, NOT overridable). Both trip over
      # bvarnet's `Suggests: cmdstanr` (Additional_repositories: mc-stan.org), which this job's
      # setup-r step doesn't configure -- and shouldn't: build-manifest.R only needs
      # jsonlite + digest + base R, never bvarnet itself. A plain install.packages() (binaries
      # via RSPM from setup-r's use-public-rspm) avoids the whole class of problem.
      - name: Install jsonlite + digest
        shell: Rscript {0}
        run: |
          install.packages(c("jsonlite", "digest"))
          stopifnot(requireNamespace("jsonlite"), requireNamespace("digest"))

      - uses: actions/download-artifact@v4
        with:
          pattern: model-asset-*
          path: artifacts

      - name: Build manifest.json
        shell: Rscript {0}
        run: |
          source(".github/scripts/build-manifest.R")
          build_manifest(artifacts_dir = "artifacts", out_file = "manifest.json")

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name }}
          # Manual workflow_dispatch runs (e.g. a throwaway citest-<sha> tag) are ALWAYS
          # published as a pre-release, so a test run never becomes the repo's "Latest"
          # release. Real release-publish triggers leave this at the default (false),
          # matching a normal full release.
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          files: |
            artifacts/**/*.tar.gz
            manifest.json

  # ---------------------------------------------------------------------------
  # DOWNLOAD-TEST: a *separate* job (hence a fresh VM) that pretends to be a
  # toolchain-free user. It installs ONLY the cmdstanr R package -- never
  # install_cmdstan() -- so there is no ~/.cmdstan and the baked-rpath confound
  # cannot mask a missing bundled lib. GitHub-hosted runners are clean by
  # default; keeping this off the build job is what guarantees cleanliness.
  # ---------------------------------------------------------------------------
  download-test:
    name: download-test (${{ matrix.config.os }})
    needs: manifest
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: macos-14 }
          - { os: macos-15-intel }  # macos-13 (Intel) deprecated/removed by GitHub; see build matrix
          - { os: ubuntu-latest }   # newer glibc than the 22.04 build floor -> proves forward travel
          - { os: windows-latest }
    runs-on: ${{ matrix.config.os }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      BVARNET_ALLOW_DOWNLOAD: "true"
      # Test-only seam (R/download_models.R): the client normally fetches from the
      # v<packageVersion> tag, but CI test runs publish to a throwaway tag like
      # citest-<sha>. Without this override every download-test leg would 404 on
      # the (deliberately nonexistent) v<version> release and fail. For a real
      # release-publish trigger the tag IS v<version>, so this is then a no-op.
      BVARNET_MODELS_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: 'https://mc-stan.org/r-packages/'

      - name: Guard -- runner must have NO CmdStan (clean-user invariant)
        shell: Rscript {0}
        run: |
          # If ~/.cmdstan exists here the test is worthless: a stale rpath could
          # resolve TBB and hide a bundling bug. Fail rather than pass falsely.
          if (dir.exists(path.expand("~/.cmdstan"))) {
            stop("~/.cmdstan present -- this job must run on a clean runner; never call install_cmdstan() here")
          }
          if (requireNamespace("cmdstanr", quietly = TRUE)) {
            p <- tryCatch(cmdstanr::cmdstan_path(), error = function(e) "")
            if (nzchar(p)) stop("cmdstan_path() is already set -- runner is not clean")
          }
          cat("clean-user invariant OK\n")

      - name: Install bvarnet + the cmdstanr R package ONLY (no CmdStan)
        shell: Rscript {0}
        run: |
          # install.packages(".", repos = NULL) does NOT pull in dependencies, and a
          # clean runner has none of bvarnet's Imports -- so install them first via
          # remotes::install_deps() (setup-r already configured RSPM + mc-stan repos).
          # Installing bvarnet from source WITHOUT CmdStan is exactly the CRAN-binary
          # scenario: src/install.libs.R skips model compilation when CmdStan is
          # absent, which is the whole premise of the download fallback.
          install.packages("remotes")
          remotes::install_deps(".")   # Depends/Imports/LinkingTo only, not Suggests
          install.packages("cmdstanr") # mc-stan repo configured via extra-repositories
          install.packages(".", repos = NULL, type = "source")
          # install.packages() only WARNS on a failed install (see the implementation
          # doc's pitfall list) -- assert hard so a failure surfaces here, not two
          # steps later as a confusing "no package called bvarnet".
          stopifnot(
            requireNamespace("bvarnet", quietly = TRUE),
            requireNamespace("cmdstanr", quietly = TRUE)
          )
          cat("installed bvarnet", as.character(packageVersion("bvarnet")),
              "with cmdstanr", as.character(packageVersion("cmdstanr")), "\n")

      # On Windows, strip Rtools/mingw from PATH so a co-located tbb.dll is the
      # ONLY way TBB can resolve -- proves discovery is co-location, not ambient
      # PATH. Harmless belt-and-suspenders on top of the build-job static-link
      # assertion. MUST be pwsh, not bash: Git Bash exposes PATH in POSIX format
      # (/c/R/bin:/c/...), and writing that into GITHUB_ENV would replace the
      # Windows-format PATH (C:\R\bin;C:\...) for every later step, making even
      # Rscript unfindable. ORIG_PATH is saved so the post-fit assertion step can
      # get objdump (in the stripped Rtools dir) back.
      - name: De-mingw PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "ORIG_PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $clean = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'rtools|mingw|msys' }) -join ';'
          "PATH=$clean" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "stripped PATH entries:"
          $env:PATH -split ';' | Where-Object { $_ -match 'rtools|mingw|msys' } | Write-Host

      - name: Download + run end-to-end (the real client path)
        shell: Rscript {0}
        run: |
          ok <- bvarnet::bvarnet_setup_models(method = "download", ask = FALSE)
          if (!isTRUE(ok)) stop("bvarnet_setup_models(method = 'download') did not succeed")

          data <- data.frame(
            id = rep(1:3, each = 20), t = rep(1:20, 3),
            y_1 = rnorm(60), y_2 = rnorm(60), x_1 = rnorm(60)
          )
          fit <- bvarnet::bvar(
            id_col = "id", time_col = "t", y_cols = c("y_1", "y_2"), x_cols = "x_1",
            data = data, family = "gaussian", K = 1,
            iter = 50, warmup = 50, chains = 1, cores = 1, seed = 1
          )
          stopifnot(inherits(fit, "bvarnet"))
          cat("download-test: real fit succeeded, draws dim:",
              paste(dim(fit$draws), collapse = "x"), "\n")

      # Iterate the three exe names EXPLICITLY -- a bare model_* glob would also
      # match the co-staged model_*.stan sources, and otool/ldd on a text file
      # errors, turning a healthy cache into a false failure.
      - name: Native-dependency assertion (macOS/Linux) -- no unresolved TBB
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          cache_dir=$(Rscript -e 'cat(bvarnet::bvarnet_model_cache_dir())')
          echo "cache dir: $cache_dir"
          for name in model_gaussian model_binary model_ordinal; do
            f="$cache_dir/$name"
            [ -f "$f" ] || { echo "::error::$f missing from cache"; exit 1; }
            if [ "${{ runner.os }}" = "macOS" ]; then
              otool -L "$f"
              otool -L "$f" | grep -qi tbb || { echo "::error::no tbb dependency found in $f"; exit 1; }
            else
              ldd "$f" || true
              if ldd "$f" | grep -qi "not found"; then
                echo "::error::unresolved dependency in $f"; exit 1
              fi
            fi
          done

      # Separate pwsh step for Windows: the fit above ran with the de-mingw'd PATH
      # (that was the point), but the static-link check needs objdump, which lives
      # in the stripped Rtools dir -- so restore ORIG_PATH for this inspection-only
      # step. The fit itself has already proven co-location works.
      - name: Native-dependency assertion (Windows) -- no MinGW leak, tbb.dll co-located
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = $env:ORIG_PATH
          $cache = Rscript -e 'cat(bvarnet::bvarnet_model_cache_dir())'
          Write-Host "cache dir: $cache"
          foreach ($name in @('model_gaussian', 'model_binary', 'model_ordinal')) {
            $exe = Join-Path $cache "$name.exe"
            if (-not (Test-Path $exe)) { Write-Error "$exe missing from cache"; exit 1 }
            Rscript .github/scripts/check-windows-static-link.R $exe
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          if (-not (Test-Path (Join-Path $cache 'tbb.dll'))) {
            Write-Error "tbb.dll not co-located beside the model exes in $cache"; exit 1
          }
          Write-Host "OK: static-link clean + tbb.dll co-located"
